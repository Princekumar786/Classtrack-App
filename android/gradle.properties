org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# This PC has 16 GB RAM. Old idle Gradle/Kotlin daemons (about 12 GB in total)
# stayed alive between builds and pushed Windows into paging, so R8 crawled.
# Cap the Kotlin daemon and let idle daemons exit after 30 minutes.
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
# ── Build performance ──────────────────────────────────────────────────────
# Reuse task outputs across builds (big win for incremental release builds) and
# run independent tasks in parallel. Both are safe and reversible; delete these
# lines to revert. The Gradle daemon (on by default) keeps warm between builds,
# so back-to-back builds are far faster than a cold first build.
org.gradle.caching=true
org.gradle.parallel=true
# ── Kotlin Gradle Plugin (KGP) / AGP 9 compatibility ───────────────────────
# We build with AGP 9.0.1, which removes support for third-party Flutter
# plugins that apply the Kotlin Gradle Plugin (KGP) the legacy way. Several of
# our plugins (cloud_functions, file_picker, firebase_*, flutter_timezone,
# home_widget, purchases_flutter, receive_sharing_intent, share_plus) still do,
# which is the source of the non-blocking "plugins apply KGP" build warning.
#
# These two flags keep the build on the supported legacy path so those plugins
# compile. The app module itself is ALREADY migrated (no kotlin-android plugin;
# it uses the kotlin { compilerOptions { } } DSL), so the ONLY thing standing
# between us and built-in Kotlin is the plugins updating upstream.
#
# DO NOT set either flag to `true` until EVERY Flutter plugin we depend on has
# migrated to built-in Kotlin — flipping them now makes `flutter build` fail
# (see https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin).
# Re-check the plugins' changelogs periodically; once they're all migrated,
# set android.builtInKotlin=true and rebuild to drop the warning for good.
android.newDsl=false
android.builtInKotlin=false
# ── R8 optimization ────────────────────────────────────────────────────────
# Turn on R8 "full mode" explicitly so the release build gets the most
# aggressive optimization/obfuscation/shrinking pass (addresses the Play
# Console "Improve your app's memory and performance with R8 optimization"
# recommendation). Full mode is the modern default, but pinning it here makes
# the intent explicit and future-proofs the setting against toolchain changes.
#
# NOTE: the low obfuscation/shrinking RATES the Play Console reports are driven
# mainly by the broad `-keep class …{ *; }` rules in app/proguard-rules.pro
# (Firebase, GMS, RevenueCat, etc.). Those are intentional safety keeps for
# reflection-heavy libraries; narrowing them raises the rates further but must
# be validated with a release smoke-test on a device before shipping.
android.enableR8.fullMode=true

