<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ClassTrack — Google Play assets v2 (pastel)</title>
<!--
  One template, three outputs. Open with:
    ?fmt=phone&slide=1..8   → 1080×1920 phone screenshot
    ?fmt=wide&slide=1..8    → 1920×1080 landscape screenshot (also valid for 7"/10" tablet)
    ?fmt=fg                 → 1024×500 feature graphic
  Phone screens are REAL captures from tool/store_capture (../store-2026/raw).
-->
<style>
@font-face{font-family:Poppins;src:url('../../assets/fonts/Poppins-Medium.ttf');font-weight:500}
@font-face{font-family:Poppins;src:url('../../assets/fonts/Poppins-SemiBold.ttf');font-weight:600}
@font-face{font-family:Poppins;src:url('../../assets/fonts/Poppins-Bold.ttf');font-weight:700}
@font-face{font-family:Inter;src:url('../../assets/fonts/Inter-Regular.ttf');font-weight:400}
@font-face{font-family:Inter;src:url('../../assets/fonts/Inter-Medium.ttf');font-weight:500}
@font-face{font-family:Inter;src:url('../../assets/fonts/Inter-SemiBold.ttf');font-weight:600}

:root{--ink:#1B1C34;--ink2:#4A4B66;--primary:#6C5CE7;--bezel:#1E1F38}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#fff}
body{font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}

.canvas{position:absolute;inset:0;overflow:hidden}
/* soft light blobs, same feel as the reference */
.blob{position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none}

/* ── Copy ── */
.copy{position:absolute;z-index:10}
.brand{display:flex;align-items:center;gap:16px}
.brand img{border-radius:18px;box-shadow:0 10px 24px rgba(55,48,163,.25)}
.brand b{font-family:Poppins;font-weight:700;letter-spacing:-.5px}
.tag{display:inline-flex;align-items:center;gap:10px;border-radius:100px;font-family:Inter;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.75);color:var(--primary);
  box-shadow:0 6px 18px -8px rgba(27,28,52,.25)}
.tag i{border-radius:50%;background:var(--primary)}
h1{font-family:Poppins;font-weight:700;color:var(--ink)}
h1 em{font-style:normal;color:var(--primary)}
.sub{font-family:Inter;font-weight:400;color:var(--ink2)}

/* ── Phone frame ── */
.phone{position:absolute;background:var(--bezel);
  box-shadow:0 0 0 2px #34365A inset,0 60px 90px -30px rgba(27,28,52,.45),0 24px 40px -18px rgba(85,70,201,.35)}
.phone .screen{position:relative;overflow:hidden;background:#F1EFFB;height:100%}
.phone .screen img{display:block;width:100%;height:auto}
.phone .punch{position:absolute;left:50%;border-radius:50%;background:#0B0C18;z-index:2}
.status{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  font-family:Inter;font-weight:600;color:var(--ink);z-index:2}
.status .ic{display:flex;align-items:center}

/* ── Decorations ── */
.spark{position:absolute;z-index:11}
.dot{position:absolute;border-radius:50%;z-index:1}
.mascot{position:absolute;z-index:12;filter:drop-shadow(0 24px 30px rgba(85,70,201,.35))}

/* ── Benefit chip (copy, not fake UI) ── */
.chip{position:absolute;z-index:13;display:flex;align-items:center;background:#fff;border-radius:999px;
  font-family:Inter;font-weight:600;color:var(--ink);box-shadow:0 22px 44px -16px rgba(27,28,52,.35)}
.chip .ci{display:grid;place-items:center;border-radius:50%;color:#fff}
.chip .ci svg{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="canvas" id="c"></div>
<script>
const RAW = '../store-2026/raw/';
const M = '../../assets/mascot/';
const ICONS = {
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  bell:'<path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 004 0"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  chart:'<path d="M4 18l5-6 4 3 7-9"/>',
  flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  gift:'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M12 9v11M4 13h16M12 9c-2-4-6-3-5 0M12 9c2-4 6-3 5 0"/>'
};

// Background palette per slide — soft pastels like the references.
const S = {
  1:{bg:'#ECE8FC', b1:'#D9D2FF', b2:'#FFFFFF', tag:'Attendance tracker',
     h:'Know which classes<br><em>you can skip.</em>',
     sub:'Live attendance for every subject, a safe-to-skip count, and an alert before you drop below your target.',
     phones:[{src:'01_home.png'},{src:'02_attendance.png'}], mascot:'mascot_excited.png',
     chip:{t:'Safe-to-skip count', i:'check', c:'#22C55E'}},
  2:{bg:'#E6E3FB', b1:'#D3CCFF', b2:'#F6F4FF', tag:'AI timetable import',
     h:'Snap your timetable.<br><em>AI builds your week.</em>',
     sub:'Take a photo, upload a PDF or paste text. Review the classes AI found, then save. No typing every lecture.',
     phones:[{src:'09_import.png'},{src:'04_schedule.png'}], mascot:'mascot_wave.png',
     chip:{t:'Photo, PDF or text', i:'camera', c:'#6C5CE7'}},
  3:{bg:'#FCF1CF', b1:'#FFE59A', b2:'#FFF9E8', tag:'Tasks & homework',
     h:'Every deadline,<br><em>one list.</em>',
     sub:'Assignments, to-dos and events sorted by Overdue, Today and Next 7 days, with reminders before they are due.',
     phones:[{src:'05_tasks.png'}], mascot:'mascot_think.png',
     chip:{t:'Reminders before it’s due', i:'bell', c:'#F59E0B'}},
  4:{bg:'#FDE6D8', b1:'#FFCFB3', b2:'#FFF4EC', tag:'Exam countdown',
     h:'Exams never<br><em>sneak up on you.</em>',
     sub:'Countdowns for every exam, with a prep checklist so you know what’s left to study.',
     phones:[{src:'10_exams.png'}], mascot:null,
     chip:{t:'Prep checklist', i:'flag', c:'#F59E0B'}},
  5:{bg:'#E4E0FB', b1:'#CFC6FF', b2:'#F5F3FF', tag:'AI study planner',
     h:'Turn any goal<br><em>into a study plan.</em>',
     sub:'Pick a subject and a deadline. Get a day-by-day roadmap that fits your week.',
     phones:[{src:'03_planner.png'},{src:'03b_plan_overview.png'}], mascot:'mascot_celebrate.png',
     chip:{t:'Day-by-day roadmap', i:'spark', c:'#6C5CE7'}},
  6:{bg:'#DDF3E8', b1:'#BDEBD4', b2:'#F1FBF6', tag:'Grades & GPA',
     h:'Track your GPA<br><em>as you go.</em>',
     sub:'Log every quiz and lab. Your grades and GPA update as you go, on a 4.0 or 10-point scale.',
     phones:[{src:'06_grades.png'}], mascot:null,
     chip:{t:'4.0 & 10-point scales', i:'chart', c:'#22C55E'}},
  7:{bg:'#E9E5FC', b1:'#D6CEFF', b2:'#FFFFFF', tag:'AI assistant',
     h:'Ask your schedule<br><em>anything.</em>',
     sub:'“What does my Monday look like?” Get answers from your own classes, tasks and attendance.',
     phones:[{src:'08_assistant.png'}], mascot:'mascot_talk.png',
     chip:{t:'Answers from your data', i:'spark', c:'#6C5CE7'}},
  8:{bg:'#DCEAFB', b1:'#BFD8FA', b2:'#F2F7FE', tag:'Student opportunities',
     h:'Internships &amp; scholarships,<br><em>in one feed.</em>',
     sub:'Hackathons, certifications, scholarships and student discounts picked for your profile.',
     phones:[{src:'07_opportunities.png'}], mascot:null,
     chip:{t:'Picked for your profile', i:'gift', c:'#0EA5E9'}},
};

// Layout per format. All sizes in px of the output canvas.
const L = {
  phone:{W:1080,H:1920, copy:{l:84,t:104,w:912}, icon:58, brand:30, brandGap:44,
    tag:{fs:20,pad:'11px 20px',dot:9,mb:26}, h1:{fs:90,lh:1.04,ls:-3.2}, sub:{fs:33,lh:1.42,mt:24,w:880},
    pair:[{x:40,y:830,w:540,r:-8},{x:470,y:730,w:580,r:6}], single:{x:190,y:760,w:700,r:0},
    bez:{p:16,r:78,sr:62,punch:22,stH:44,stF:20,stPad:'8px 46px 0 56px'},
    mascot:{x:790,y:1650,w:270}, chip:{x:56,y:1700,fs:28,pad:'16px 30px 16px 16px',ci:52,gap:16},
    sparks:[[960,96,58,'#F9C74F'],[60,700,34,'#8B7FEC'],[1010,1120,30,'#FFFFFF']]},
  wide:{W:1920,H:1080, copy:{l:130,t:0,w:820,center:true}, icon:60, brand:32, brandGap:46,
    tag:{fs:20,pad:'11px 20px',dot:9,mb:26}, h1:{fs:96,lh:1.04,ls:-3.4}, sub:{fs:34,lh:1.45,mt:28,w:760},
    pair:[{x:1060,y:200,w:440,r:-8},{x:1400,y:130,w:470,r:6}], single:{x:1230,y:120,w:520,r:0},
    bez:{p:14,r:66,sr:52,punch:18,stH:38,stF:17,stPad:'6px 38px 0 46px'},
    mascot:{x:1640,y:770,w:250}, chip:{x:1000,y:860,fs:26,pad:'14px 28px 14px 14px',ci:48,gap:14},
    sparks:[[1000,110,54,'#F9C74F'],[1860,90,30,'#8B7FEC'],[1010,700,26,'#FFFFFF']]},
};

const q = new URLSearchParams(location.search);
const fmt = q.get('fmt') || 'phone';
const c = document.getElementById('c');
const el = (tag, cls, css, html) => { const e = document.createElement(tag); if (cls) e.className = cls;
  if (css) Object.assign(e.style, css); if (html != null) e.innerHTML = html; c.appendChild(e); return e; };
const sparkSvg = (col) => `<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="${col}" d="M12 0c.9 6.3 5.7 11.1 12 12-6.3.9-11.1 5.7-12 12-.9-6.3-5.7-11.1-12-12C6.3 11.1 11.1 6.3 12 0z"/></svg>`;

function statusBar(b) {
  const f = '#1B1C34';
  return `<div class="status" style="height:${b.stH}px;font-size:${b.stF}px;padding:${b.stPad}">
    <span>9:41</span><span class="ic" style="gap:${b.stF*0.4}px">
    <svg height="${b.stF*0.85}" viewBox="0 0 18 12"><path fill="${f}" d="M1 11h2V8H1zm4 0h2V6H5zm4 0h2V3H9zm4 0h2V0h-2z"/></svg>
    <svg height="${b.stF*0.85}" viewBox="0 0 16 12"><path fill="${f}" d="M8 11.5L0 3.6a11.3 11.3 0 0116 0z"/></svg>
    <svg height="${b.stF*0.85}" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="${f}"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="${f}"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="${f}"/></svg>
    </span></div><span class="punch" style="width:${b.punch}px;height:${b.punch}px;margin-left:-${b.punch/2}px;top:${b.stH*0.3}px"></span>`;
}
function phone(src, p, b, z) {
  const screenH = Math.round((p.w - 2*b.p) * 2340 / 1080);
  el('div', 'phone', {left:p.x+'px', top:p.y+'px', width:p.w+'px', height:(screenH + 2*b.p)+'px',
    padding:b.p+'px', borderRadius:b.r+'px', transform:`rotate(${p.r}deg)`, zIndex:z},
    `<div class="screen" style="border-radius:${b.sr}px">${statusBar(b)}<img src="${RAW+src}" alt=""></div>`);
}
function background(s, W, H) {
  c.style.background = s.bg;
  el('div', 'blob', {width:W*0.9+'px', height:W*0.9+'px', right:-W*0.25+'px', top:-W*0.3+'px',
    background:`radial-gradient(circle, ${s.b1} 0%, transparent 65%)`});
  el('div', 'blob', {width:W*0.8+'px', height:W*0.8+'px', left:-W*0.3+'px', bottom:-W*0.25+'px',
    background:`radial-gradient(circle, ${s.b2} 0%, transparent 65%)`});
}
function brand(parent, size, font, gap) {
  const b = document.createElement('div'); b.className = 'brand'; b.style.marginBottom = gap + 'px';
  b.innerHTML = `<img src="../../assets/icon/icon.png" style="width:${size}px;height:${size}px" alt=""><b style="font-size:${font}px">ClassTrack</b>`;
  parent.appendChild(b);
}

if (fmt === 'fg') {
  // ── Feature graphic 1024×500 ──
  const W = 1024, H = 500;
  document.documentElement.style.cssText = document.body.style.cssText = `width:${W}px;height:${H}px`;
  background({bg:'#E9E5FC', b1:'#D3CBFF', b2:'#FFFFFF'}, W, H);
  const copy = el('div', 'copy', {left:'60px', top:'0', height:H+'px', width:'540px', display:'flex',
    flexDirection:'column', justifyContent:'center'});
  brand(copy, 50, 26, 26);
  copy.insertAdjacentHTML('beforeend',
    `<h1 style="font-size:50px;line-height:1.06;letter-spacing:-1.8px">Attendance tracker <em>for students.</em></h1>
     <p class="sub" style="font-size:19px;line-height:1.45;margin-top:16px;width:540px">Bunk calculator · Timetable · Homework · Exam planner</p>`);
  const b = {p:9, r:42, sr:34, punch:10, stH:22, stF:10, stPad:'4px 24px 0 28px'};
  phone('02_attendance.png', {x:590, y:70, w:250, r:-7}, b, 4);
  phone('01_home.png', {x:770, y:40, w:250, r:6}, b, 5);
  el('img', 'mascot', {left:'880px', top:'330px', width:'150px'}).src = M + 'mascot_wave.png';
  [[560,40,30,'#F9C74F'],[985,250,18,'#8B7FEC']].forEach(([x,y,s,col]) =>
    el('div', 'spark', {left:x+'px', top:y+'px', width:s+'px', height:s+'px'}, sparkSvg(col)));
} else {
  const n = q.get('slide') || '1', s = S[n], l = L[fmt];
  document.documentElement.style.cssText = document.body.style.cssText = `width:${l.W}px;height:${l.H}px`;
  background(s, l.W, l.H);

  // Copy block
  const cs = {left:l.copy.l+'px', width:l.copy.w+'px'};
  if (l.copy.center) Object.assign(cs, {top:'0', height:l.H+'px', display:'flex', flexDirection:'column', justifyContent:'center'});
  else cs.top = l.copy.t + 'px';
  const copy = el('div', 'copy', cs);
  brand(copy, l.icon, l.brand, l.brandGap);
  copy.insertAdjacentHTML('beforeend',
    `<div><span class="tag" style="font-size:${l.tag.fs}px;padding:${l.tag.pad};margin-bottom:${l.tag.mb}px"><i style="width:${l.tag.dot}px;height:${l.tag.dot}px"></i>${s.tag}</span></div>
     <h1 style="font-size:${l.h1.fs}px;line-height:${l.h1.lh};letter-spacing:${l.h1.ls}px">${s.h}</h1>
     <p class="sub" style="font-size:${l.sub.fs}px;line-height:${l.sub.lh};margin-top:${l.sub.mt}px;max-width:${l.sub.w}px">${s.sub}</p>`);

  // Phones
  if (s.phones.length === 2) {
    phone(s.phones[0].src, l.pair[0], l.bez, 4);
    phone(s.phones[1].src, l.pair[1], l.bez, 5);
  } else {
    phone(s.phones[0].src, l.single, l.bez, 5);
  }

  // Decorations
  l.sparks.forEach(([x,y,sz,col]) => el('div', 'spark', {left:x+'px', top:y+'px', width:sz+'px', height:sz+'px'}, sparkSvg(col)));
  el('div', 'dot', {left:(l.W*0.06)+'px', top:(l.H*0.93)+'px', width:'16px', height:'16px', background:'#F7A8B8'});
  if (s.mascot) el('img', 'mascot', {left:l.mascot.x+'px', top:l.mascot.y+'px', width:l.mascot.w+'px'}).src = M + s.mascot;
  if (s.chip) el('div', 'chip', {left:l.chip.x+'px', top:l.chip.y+'px', fontSize:l.chip.fs+'px', padding:l.chip.pad, gap:l.chip.gap+'px'},
    `<span class="ci" style="width:${l.chip.ci}px;height:${l.chip.ci}px;background:${s.chip.c}"><svg viewBox="0 0 24 24" width="${l.chip.ci*0.5}" height="${l.chip.ci*0.5}">${ICONS[s.chip.i]}</svg></span>${s.chip.t}`);
}

// Layout QA: ?measure=1 prints copy/phone geometry and image load state.
if (q.get('measure')) window.addEventListener('load', () => {
  const r = e => { const b = e.getBoundingClientRect(); return [Math.round(b.left), Math.round(b.top), Math.round(b.right), Math.round(b.bottom)]; };
  const copy = r(document.querySelector('.copy'));
  const phones = [...document.querySelectorAll('.phone')].map(r);
  const imgs = [...document.images].map(i => i.complete && i.naturalWidth > 0);
  const pre = document.createElement('pre'); pre.id = 'measure';
  pre.textContent = JSON.stringify({copy, phones, imagesOk: imgs.every(Boolean), n: imgs.length});
  document.body.appendChild(pre);
});
</script>
</body>
</html>
