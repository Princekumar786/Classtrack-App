name: classtrack
description: "ClassTrack — Attendance & class schedule tracker with Gemini AI import."
publish_to: "none"
version: 1.0.64+68

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0
  # Held at 6.x: v7 is a full API rewrite; keeping the sign-in flow we verified.
  google_sign_in: ^6.2.1

  # Plain REST client for the Google Calendar API v3 (events.list). Used by the
  # "Import from Google Calendar" flow instead of the heavier googleapis bundle.
  http: ^1.2.2

  # Subscriptions / in-app purchases (RevenueCat)
  # 10.x bundles Google Play Billing Library 8.x (required by Google Play from Aug 31, 2026).
  purchases_flutter: ^10.4.3

  # Routing
  go_router: ^14.2.7

  # Calendar & schedule
  table_calendar: ^3.2.0

  # Notifications
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

  # Home-screen widget
  home_widget: ^0.9.0

  # Files, media & sharing
  image_picker: ^1.1.2
  # Held at 10.x: share_plus 13 needs win32 ^6, which conflicts with the stable
  # file_picker line (win32 ^5); only file_picker 12-beta uses win32 6.
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

  # Receive links/text shared TO ClassTrack via the Android/iOS share sheet.
  # Used to open the editable "New item" sheet pre-filled with the shared URL.
  # Pinned to 1.8.1: 1.9.0 hard-codes compileSdk 37 (a preview platform) which
  # fails the Android build against the stable SDK this project targets.
  receive_sharing_intent: 1.8.1

  # Export
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0

  # UI / polish
  google_fonts: ^8.0.0
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  # Renders the official multi-colour Google "G" logo (SVG) on the auth
  # buttons, per Google's sign-in branding guidelines.
  flutter_svg: ^2.0.10

  # Utils
  intl: ^0.20.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  google_generative_ai: ^0.4.7
  file_picker: ^10.0.0
  syncfusion_flutter_pdf: ^34.1.32
  firebase_analytics: ^12.4.5
  firebase_messaging: ^16.4.3
  # Crash + non-fatal error reporting. Paired with firebase_core 4.x.
  firebase_crashlytics: ^5.2.7

  # Product analytics (PostHog, EU cloud): behaviour events, screen views, app
  # lifecycle, user identify/reset and error tracking. Fans out alongside
  # Firebase Analytics via AnalyticsService; initialised manually in main.dart.
  posthog_flutter: ^5.26.0
  in_app_review: 2.0.12
  in_app_update: 5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  fake_cloud_firestore: 4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/fonts/
    - assets/mascot/
    - assets/characters/
    - assets/brand/

  # Bundled fonts. Shipping the .ttf assets locally means the very first frame
  # renders in Poppins/Inter with NO runtime download — removing the launch
  # reflow that happened while google_fonts fetched them over the network.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#3730A3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#3730A3"
    theme_color: "#3730A3"

# Splash screen (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#3730A3"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#3730A3"
    image: "assets/icon/splash_logo.png"
  color_dark: "#0B1020"
  image_dark: "assets/icon/splash_logo.png"

